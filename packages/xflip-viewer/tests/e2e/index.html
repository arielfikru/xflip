<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xflip-card e2e fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      xflip-card {
        --xflip-width: 240px;
      }
    </style>
  </head>
  <body>
    <main>
      <xflip-card id="card"></xflip-card>
    </main>
    <script type="module">
      import { encode } from '@xflip/core';
      import { XflipCardElement } from '@xflip/viewer';
      import '@xflip/viewer/define';

      // Smallest valid bytes for PNG/JPEG headers — the face <img> never has
      // to decode them in tests, but the renderer needs a recognized format
      // tag in HEAD plus non-empty face payloads.
      const PNG_HEADER = new Uint8Array([0x89, 0x50, 0x4e, 0x47]);

      function buildFile(kind) {
        const head = {
          width: 100,
          height: 140,
          frontFormat: 'png',
          backFormat: 'png',
          flipAxis: 'horizontal',
          flags: 0,
        };
        const file = {
          versionMajor: 1,
          versionMinor: kind === 'layered' ? 1 : 0,
          head,
          front: PNG_HEADER,
          back: PNG_HEADER,
        };
        if (kind === 'layered') {
          file.frontLayers = {
            version: 1,
            flags: 0,
            layers: [
              {
                layerId: 0,
                format: 'png',
                blendMode: 'screen',
                effectType: 'holographic',
                opacity: 200,
                zOrder: 0,
                response: { type: 'tilt', intensity: 1.0, offset_max_x: 8, offset_max_y: 8 },
                imageData: PNG_HEADER,
              },
            ],
          };
          file.effects = {
            tilt_sensitivity: 1.2,
            tilt_max_angle: 12,
            perspective: 1000,
            ambient_intensity: 0.4,
          };
        }
        return file;
      }

      const params = new URLSearchParams(location.search);
      const kind = params.get('kind') ?? 'flat';

      const card = document.getElementById('card');

      // Expose a stable handle the spec files can poll. We resolve a promise
      // once the xflip-load event fires so tests don't race the network /
      // decode boundary.
      const ready = new Promise((resolve, reject) => {
        card.addEventListener('xflip-load', (ev) => resolve(ev.detail), { once: true });
        card.addEventListener('xflip-error', (ev) => reject(ev.detail.error), { once: true });
      });
      window.__xflipReady = ready;
      window.__xflipCard = card;
      window.__XflipCardElement = XflipCardElement;

      try {
        const bytes = encode(buildFile(kind));
        const blob = new Blob([bytes], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        card.setAttribute('src', url);
      } catch (err) {
        document.title = 'xflip-card e2e fixture (encode failed)';
        console.error(err);
      }
    </script>
  </body>
</html>
